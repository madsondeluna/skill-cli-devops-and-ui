name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: pip install rich
      - name: Unit tests for the vendorable template
        run: make test
      - name: Terminal hygiene harness
        # Runs the demo tool under a pseudo terminal, a pipe, NO_COLOR and CI,
        # and fails the build on any blocking finding.
        run: make audit
      - name: House style (no emojis, no em dashes)
        run: python3 .github/check_style.py
